name: CI
# PR门禁流水线，需要通过backend-lint、backend-test和frontend-check
# 三项通过时gate全绿才算通过
# 通过后通过notify-qa和notify-developer通知QA和开发者通过
on:
  # 触发时刻
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-lint:
    name: backend-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"
          python-version: "3.13.13"
          enable-cache: true
      - name: Install backend deps
        working-directory: backend
        run: uv sync --group dev
      - name: Check uv.lock is in sync
        working-directory: backend
        run: uv lock --check
      - name: Lint backend
        working-directory: backend
        run: make lint

  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: deerflow
          POSTGRES_PASSWORD: deerflow
          POSTGRES_DB: deerflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URI: postgresql://deerflow:deerflow@localhost:5432/deerflow_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"
          python-version: "3.13.13"
          enable-cache: true
      - name: Install backend deps
        working-directory: backend
        run: uv sync --group dev --extra postgres
      - name: Run tests (shard ${{ matrix.shard }} of 4)
        working-directory: backend
        env:
          DEERFLOW_TEST_WORKFLOW_POSTGRES: ${{ env.TEST_POSTGRES_URI }}
          DEDUPE_TEST_POSTGRES_URL: ${{ env.TEST_POSTGRES_URI }}
        run: make test-shard SPLITS=4 GROUP=${{ matrix.shard }}

  frontend-check:
    name: frontend-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack prepare pnpm@10.26.2 --activate
      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck
      - name: Unit tests
        working-directory: frontend
        run: pnpm test

  gate:
    name: gate
    needs: [backend-lint, backend-test, frontend-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate
        run: |
          echo "backend-lint=${{ needs.backend-lint.result }}"
          echo "backend-test=${{ needs.backend-test.result }}"
          echo "frontend-check=${{ needs.frontend-check.result }}"
          [ "${{ needs.backend-lint.result }}" = "success" ] || exit 1
          [ "${{ needs.backend-test.result }}" = "success" ] || exit 1
          [ "${{ needs.frontend-check.result }}" = "success" ] || exit 1

  notify-qa:
    name: notify-qa
    needs: [gate]
    if: needs.gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Ping qa once per head SHA
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if gh pr view "$PR" --json comments --jq '.comments[].body' | grep -qF "ci-ok:$SHA"; then
            echo "already pinged for $SHA"; exit 0
          fi
          gh pr comment "$PR" --body "<!-- ci-ok:$SHA -->@sf-qa 门禁已过（gate=success，sha ${SHA:0:7}）。请按 AC 逐条验收，禁止用自跑结果替代门禁结论。CI: $RUN"

  notify-developer:
    name: notify-developer
    needs: [gate]
    if: needs.gate.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Ping developer with circuit breaker
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if gh pr view "$PR" --json comments --jq '.comments[].body' | grep -qF "ci-fail:$SHA"; then
            echo "already pinged for $SHA"; exit 0
          fi
          N=$(gh pr view "$PR" --json comments --jq '[.comments[].body|select(contains("<!-- ci-fail"))]|length')
          if [ "$N" -ge 3 ]; then
            gh pr comment "$PR" --body "<!-- ci-fail:$SHA -->门禁连续 3 次失败，已停止自动修复，请人工介入。CI: $RUN"
            exit 0
          fi
          gh pr comment "$PR" --body "<!-- ci-fail:$SHA -->@sf-developer 门禁未过（gate=failure）。请按日志修复后 push 到本分支（不要新建 PR），等到 gate 转绿再结束。CI: $RUN"
